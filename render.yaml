services:
  - type: web
    name: dhatchinamart
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /dhatchinamart/api/v1/health
    autoDeploy: true
    # Free demo deployment: no persistent disk. The H2 database lives on the
    # ephemeral container filesystem (/tmp) and is RE-SEEDED on each fresh
    # instance (schema.sql + seed.sql run whenever the USERS table is absent).
    # Data may be lost when Render restarts, redeploys or spins the service
    # down after ~15 min idle - acceptable for the capstone demo.
    plan: free
    envVars:
      # H2 on the ephemeral, writable container filesystem (DEMO ONLY).
      - key: DHAT_DB_URL
        value: jdbc:h2:file:/tmp/dhatchinamart;AUTO_SERVER=TRUE
      # Demo deployment: OTPs are the mock/development provider (shown on the
      # login page). For real SMS set OTP_MODE=production + SMS_PROVIDER=real
      # and provide SMS_API_URL / SMS_API_KEY. Production mode fails fast at
      # startup if the real provider is not fully configured, so the mock can
      # never be active in production.
      - key: OTP_MODE
        value: development
      - key: SMS_PROVIDER
        value: mock
      # AI assistant: mock by default (no network). Set AI_PROVIDER=gemini and
      # GEMINI_API_KEY (secret) for the real assistant; it falls back to mock
      # only if the key is missing.
      - key: AI_PROVIDER
        value: mock